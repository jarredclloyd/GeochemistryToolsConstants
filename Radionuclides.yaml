# Radionuclide information relevant to geochronology.
# Units of seconds are used to minimise rounding errors during computation and enable computation of the half life/decay constant in time using a user specified definition (e.g. tropical, IUGS annus)
# Ensure units is in a string compatible with Unitful.jl (s or yr with standard SI prefixes e.g. Gyr)
# Uncertainty follows that of GUM (aka the combined standard uncertainty). Coverage factor, k, is = 2.
# beta_plus decay is considered by the NUBASE2020 2020 definition as such it includes electron capture and positron emission.

